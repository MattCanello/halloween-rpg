<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endereço - Parte 1 de 3</title>
    <link rel="stylesheet" href="./q.css">
    <script src="scripts/q.js" type="text/javascript"></script>
    <link rel="icon" type="image/x-icon" href="../media/Copilot_20260609_225154.png" />
</head>

<body>
    <main class="panel">
        <div class="tag">1 de 3</div>
        <h1>Descubra<br>o endereço</h1>
        <article>
            <p>Tem vezes que eu sou feita de malícia.</p>
            <p>Tem quem me leve cheia para o forno e me traga vazia da mesa.</p>
            <p>Não importa: dessa vez eu sou apenas uma via.</p>
        </article>
        <section class="enigma-form">
            <form>
                <label for="resposta">Resposta</label>
                <input autofocus autocomplete="off" type="text" id="resposta" maxlength="8"
                    placeholder="Digite sua resposta aqui" inputmode="latin-name" />
                <p id="feedback-resposta" class="feedback-message" aria-live="polite"></p>
                <button type="submit">Enviar</button>
            </form>
        </section>
        <div class="badges">
            <span>________ da ________, __.</span>
        </div>
    </main>
    <script src="scripts/q1.js" type="text/javascript"></script>
</body>

</html>
