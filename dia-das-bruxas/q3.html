<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endereço - Parte 3 de 3</title>
    <link rel="stylesheet" href="./q.css">
    <script src="scripts/q.js" type="text/javascript"></script>
    <link rel="icon" type="image/x-icon" href="../media/Copilot_20260609_225154.png" />
</head>

<body>
    <main class="panel">
        <div class="tag">3 de 3</div>
        <h1>Descubra<br>o endereço</h1>
        <article>
            <p>Sou notável dentre os meus.</p>
            <p>Sozinho, formo um triângulo; em dupla, um quadrado.</p>
            <p>Se eu fosse uma temperatura, você estaria torrado.</p>
        </article>
        <section class="enigma-form">
            <form>
                <label for="resposta">Resposta</label>
                <input autofocus autocomplete="off" type="tel" id="resposta" maxlength="2" inputmode="numeric" pattern="[0-9]{2}"
                    placeholder="Digite sua resposta aqui" />
                <p id="feedback-resposta" class="feedback-message" aria-live="polite"></p>
                <button type="submit">Enviar</button>
            </form>
        </section>
        <div class="badges">
            <span>Travessa da Lanterna, __.</span>
        </div>
    </main>
    <script src="scripts/q3.js" type="text/javascript"></script>
</body>

</html>
